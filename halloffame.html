<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Road To Hall Of Fame</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root{
    --primary:#1a1a1a;
    --accent:#c5a059;
    --bg:#ffffff;
    --light:#f7f7f7;
    --border:#ececec;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Montserrat',sans-serif;
    background:var(--bg);
    color:var(--primary);
}

/* NAV */
nav{
    position:fixed;
    top:0;
    width:100%;
    padding:15px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(255,255,255,0.95);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
}

nav a{
    text-decoration:none;
    color:var(--primary);
    font-size:.75rem;
    font-weight:600;
    text-transform:uppercase;
}

nav a:hover{color:var(--accent);}

/* HEADER */

.header{
    padding-top:120px;
    padding-bottom:60px;
    text-align:center;
}

.header span{
    font-size:.75rem;
    letter-spacing:3px;
    color:var(--accent);
    font-weight:600;
}

.header h1{
    font-family:'Playfair Display',serif;
    font-size:3rem;
    font-weight:400;
    margin-top:10px;
}

/* GRID */

.container{
    max-width:1200px;
    margin:auto;
    padding:40px 8% 80px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:25px;
}

/* CARDS */

.card{
    background:white;
    border:1px solid var(--border);
    padding:30px;
    text-align:center;
    text-decoration:none;
    color:var(--primary);
    transition:all .3s ease;
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 10px 20px rgba(0,0,0,0.08);
}

.card h3{
    font-family:'Playfair Display',serif;
}

/* FOOTER */

footer{
    border-top:1px solid var(--border);
    text-align:center;
    padding:40px 0;
    font-size:.8rem;
}

</style>
</head>

<body>
